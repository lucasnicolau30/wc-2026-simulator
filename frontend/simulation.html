<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- SEO -->
  <title>Simulador Copa do Mundo 2026 | Simule grupos e campeão</title>
  <meta name="description" content="Simule a Copa do Mundo 2026 completa. Fase de grupos com 48 seleções, mata-mata e campeão. Modo automático com estatísticas reais e modo manual." />
  <meta name="keywords" content="simulador copa do mundo 2026, copa 2026, world cup 2026 simulator, simulador copa 2026, WC2026" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://wc2026simulador.com/" />

  <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://wc2026simulador.com/" />
  <meta property="og:title" content="Simulador Copa do Mundo 2026" />
  <meta property="og:description" content="Simule a Copa do Mundo 2026 completa. 48 seleções, fase de grupos e mata-mata." />

  <!-- IMAGEM DOS LINKS (WhatsApp, Facebook etc) -->
  <meta property="og:image" content="https://wc2026simulador.com/img/icon.png" />
  <meta property="og:image:secure_url" content="https://wc2026simulador.com/img/icon.png" />
  <meta property="og:image:type"content="image/png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:locale:alternate" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Simulador Copa do Mundo 2026" />
  <meta name="twitter:description" content="Simule a Copa do Mundo 2026 completa. 48 seleções, fase de grupos e mata-mata." />

  <!-- IMAGEM DO TWITTER -->
  <meta name="twitter:image" content="https://wc2026simulador.com/img/icon.png" />

  <!-- hreflang -->
  <link rel="alternate" hreflang="pt" href="https://wc2026simulador.com/" />
  <link rel="alternate" hreflang="en" href="https://wc2026simulador.com/?lang=en" />
  <link rel="alternate" hreflang="x-default" href="https://wc2026simulador.com/" />
  
  <link rel="icon" href="img/icon.png" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/simulation.css" />
</head>

<body>
  <canvas id="particles"></canvas>

  <button id="btnLang">EN</button>

  <main class="sim-container">

    <div class="sim-hero">
      <h1 class="sim-hero-title" data-i18n="homeTitle">SIMULADOR DA COPA DO MUNDO 2026</h1>
    </div>

    <div class="sim-header">
      <h2 class="sim-title" data-i18n="simTitle">Escolha o Modo de Simulação</h2>
    </div>

    <section class="sim-cards">
      <article class="sim-card">
        <div class="sim-card-icon">
          <img src="img/sim-real.png" alt="Simulação Real" />
        </div>

        <h2 class="sim-card-title" data-i18n="realTitle">Simulação Real</h2>
        <p class="sim-card-desc" data-i18n="realDesc">
          Simule os torneios usando estatísticas e dados reais para resultados mais precisos.
        </p>

        <button class="custom-button sim-btn sim-action-btn" data-mode="real">
          <span class="button-content">
            <span class="button-text" data-i18n="continue">Continuar</span>
            <span class="button-icon">→</span>
          </span>
          <span class="button-background"></span>
        </button>
      </article>

      <article class="sim-card">
        <div class="sim-card-icon">
          <img src="img/sim-manual.png" alt="Simulação Manual" />
        </div>

        <h2 class="sim-card-title" data-i18n="manualTitle">Simulação Manual</h2>
        <p class="sim-card-desc" data-i18n="manualDesc">
          Simule cada partida manualmente, escolhendo os vencedores a cada confronto.
        </p>

        <button class="custom-button sim-btn sim-action-btn" data-mode="manual">
          <span class="button-content">
            <span class="button-text" data-i18n="continue">Continuar</span>
            <span class="button-icon">→</span>
          </span>
          <span class="button-background"></span>
        </button>
      </article>
    </section>
  </main>

  <div id="pageLoader">
    <div class="loader-content">
      <div class="loader">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
      <p data-i18n="loadingSimulation">Carregando simulação...</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/translation.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/simulation.js"></script>
</body>
</html>
