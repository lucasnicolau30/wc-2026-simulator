<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="homeHeader">WC2026 Simulador</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/shared.css" />
</head>

<body>
  <canvas id="particles"></canvas>

  <button id="btnLang" >EN</button>

  <main class="container">
    <div class="hero-text">
      <h1 data-i18n="homeTitle">SIMULADOR DA COPA DO MUNDO</h1>
      <p data-i18n="homeDescription">Simule torneios inteiros com equipes reais.</p>
    </div>

    <button class="custom-button" id="startSimulation">
      <span class="button-content">
        <span class="button-text" data-i18n="startSimulation">Simular Agora</span>
        <span class="button-icon">→</span>
      </span>
      <span class="button-background"></span>
    </button>
  </main>

  <div id="pageLoader">
  <div class="loader-content">

    <img src="img/wc-logo.avif" class="loader-logo"/>

    <p data-i18n="loading">Carregando modos...</p>

  </div>
</div>

  <script src="js/translation.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/home.js"></script>

</body>
</html>
