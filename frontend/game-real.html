<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="gameHeader">WC2026 — Fase de Grupos</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/game-real.css" />
</head>
<body class="bg-groups">
  <canvas id="particles"></canvas>

  <button id="btnLang">EN</button>

  <div class="navbar-logo">
    <img src="img/wc-logo.avif" alt="WC2026" />
  </div>

  <nav class="navbar">
    <div class="navbar-tabs">
      <button class="tab active" data-tab="groups" data-i18n="groupsTab">Groups</button>
      <button class="tab" data-tab="matches" data-i18n="matchesTab">Matches</button>
      <button class="tab" data-tab="knockout" data-i18n="knockoutTab">Knockout</button>
      <button class="tab" data-tab="performance" data-i18n="performanceTab">Desempenhos</button>
    </div>
  </nav>

  <main class="page active" id="page-groups">
    <div class="page-header">
      <h1 class="page-title" data-i18n="groupStageTitle">Group Stage</h1>
    </div>

    <div class="groups-grid" id="groups-grid">
      <div class="loading" data-i18n="loadingGroups">Loading groups...</div>
    </div>
  </main>

  <main class="page" id="page-matches">
    <div class="page-header page-header--with-filter">
      <h1 class="page-title" data-i18n="matchesTitle">Matches</h1>

      <div class="page-filter-wrap">
        <div class="round-filter" id="matches-round-filter">
          <button class="round-btn active" data-round="1" data-i18n="round1">Rodada 1</button>
          <button class="round-btn" data-round="2" data-i18n="round2">Rodada 2</button>
          <button class="round-btn" data-round="3" data-i18n="round3">Rodada 3</button>
        </div>
      </div>
    </div>

    <div class="matches-list" id="matches-list">
      <div class="loading" data-i18n="loadingMatches">Loading matches...</div>
    </div>

    <div class="page-footer">
      <button class="custom-button" id="simulate-all-matches">
        <span class="button-content">
          <span class="button-text" data-i18n="simulateAll">Simulate All</span>
          <span class="button-icon">→</span>
        </span>
        <span class="button-background"></span>
      </button>
    </div>
  </main>

  <main class="page" id="page-knockout">
    <div class="page-header page-header--with-filter">
      <h1 class="page-title" data-i18n="knockoutStageTitle">Knockout Stage</h1>

      <div class="page-filter-wrap">
        <div class="round-filter" id="knockout-stage-filter">
          <button class="round-btn active" data-stage="r16" data-i18n="roundOf16">Oitavas de Final</button>
          <button class="round-btn" data-stage="quarter" data-i18n="quarterFinals">Quartas de Final</button>
          <button class="round-btn" data-stage="semi" data-i18n="semiFinals">Semifinais</button>
          <button class="round-btn" data-stage="final" data-i18n="finalTab">Final</button>
        </div>
      </div>
    </div>

    <div class="knockout-wrap">
      <p class="knockout-placeholder" data-i18n="knockoutPlaceholder">
        Simulate the group stage first.
      </p>
    </div>
  </main>

  <main class="page" id="page-performance">
    <div class="page-header page-header--with-filter">
      <h1 class="page-title" data-i18n="performancePageTitle">Desempenhos</h1>

      <div class="page-filter-wrap">
        <div class="round-filter" id="performance-filter">
          <button class="round-btn active" data-metric="rating" data-i18n="performanceRating">Média de Nota</button>
          <button class="round-btn" data-metric="goals" data-i18n="performanceGoals">Artilheiros</button>
          <button class="round-btn" data-metric="assists" data-i18n="performanceAssists">Assistências</button>
          <button class="round-btn" data-metric="cleanSheets" data-i18n="performanceCleanSheets">Clean Sheets</button>
        </div>
      </div>
    </div>

    <div class="performance-list" id="performance-list"></div>
  </main>

  <script src="js/translation.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/game-real.js"></script>
</body>
</html>
